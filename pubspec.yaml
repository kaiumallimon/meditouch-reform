name: meditouch
description: "MediTouch Healthcare & Telemedicine Mobile Application"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  # State Management & Dependency Injection
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Networking & Streaming
  dio: ^5.7.0

  # Navigation & Routing
  go_router: ^14.6.2

  # Secure Storage & Credentials
  flutter_secure_storage: ^9.2.2

  # UI, Icons, Typography & Assets
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.17
  google_fonts: ^6.2.1
  intl: ^0.19.0

  # Serialization & Data Models
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  lucide_icons_flutter: ^3.1.17

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  riverpod_generator: ^2.6.2

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/
